name: Release on tag

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+*

jobs:
  gh-release:
    name: Create release
    permissions:
      contents: write
    uses: go-openapi/ci-workflows/.github/workflows/release.yml@38ed6bf083115440d79b475442d6cf99ee450180 # v0.6.1
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

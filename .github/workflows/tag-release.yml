name: Release on tag

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+*

jobs:
  gh-release:
    name: Create release
    permissions:
      contents: write
    uses: go-openapi/ci-workflows/.github/workflows/release.yml@d87ca69d0f0464d70cdece61c88919725a3571a2 # v0.4.4
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

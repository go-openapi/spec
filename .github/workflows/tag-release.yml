name: Release on tag

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+*

jobs:
  gh-release:
    name: Create release
    permissions:
      contents: write
    uses: go-openapi/ci-workflows/.github/workflows/release.yml@1c2020082c9b8a77fde4090b0b7fe46315b31d2e # v0.6.4
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

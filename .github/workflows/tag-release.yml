name: Release on tag

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+*

jobs:
  gh-release:
    name: Create release
    permissions:
      contents: write
    uses: go-openapi/ci-workflows/.github/workflows/release.yml@692da2dae8f16666dea2392b18ad73130fbf738e # v0.6.5
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
